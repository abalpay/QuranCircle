<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | QuranCircle</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
      text-align: center;
    }
    .loader {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left: 4px solid #27ae60;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 0.5rem;
      max-width: 500px;
    }
    .container {
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #27ae60;
    }
    .manual-link {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .manual-link a {
      color: #27ae60;
      text-decoration: none;
    }
    .manual-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">QuranCircle</div>
    <div class="loader"></div>
    <h1>Redirecting you to your Quran circle...</h1>
    <p>You'll be automatically redirected in a moment.</p>
    <div class="manual-link">
      If you're not redirected, <a href="#" id="manual-redirect">click here</a>
    </div>
  </div>

  <script>
    // Extract the short code from the URL
    const pathSegments = window.location.pathname.split('/');
    const shortCode = pathSegments[pathSegments.length - 1];
    
    // Set up the manual redirect link
    const manualRedirectLink = document.getElementById('manual-redirect');
    
    // Display short code in page
    document.querySelector('h1').textContent = `Redirecting to Quran circle (${shortCode})...`;
    
    async function redirectToEvent() {
      try {
        console.log("Fetching event for short code:", shortCode);
        
        // Add status message
        const statusElement = document.createElement('p');
        statusElement.className = 'text-xs text-neutral-600 mt-2';
        statusElement.textContent = 'Fetching event details...';
        document.querySelector('.container').appendChild(statusElement);
        
        const response = await fetch(`/api/events/shortcode/${shortCode}`);
        
        if (response.ok) {
          const event = await response.json();
          console.log("Event found:", event);
          
          // Update status
          statusElement.textContent = `Found event: ${event.name} (ID: ${event.id})`;
          
          // Redirect to the event page
          const eventUrl = `/event/${event.id}`;
          manualRedirectLink.href = eventUrl;
          
          // Add a short delay to show the event found message
          setTimeout(() => {
            // Update status
            statusElement.textContent = `Redirecting to event page: ${eventUrl}`;
            
            // Perform the automatic redirect
            window.location.href = eventUrl;
          }, 1000);
        } else {
          console.error("Event not found for short code:", shortCode);
          statusElement.textContent = "Event not found. Redirecting to home page...";
          
          setTimeout(() => {
            window.location.href = "/";
          }, 2000);
        }
      } catch (error) {
        console.error("Error fetching event:", error);
        const statusElement = document.createElement('p');
        statusElement.className = 'text-xs text-neutral-600 mt-2';
        statusElement.textContent = `Error: ${error.message}. Redirecting to home page...`;
        document.querySelector('.container').appendChild(statusElement);
        
        setTimeout(() => {
          window.location.href = "/";
        }, 2000);
      }
    }
    
    // Start the redirect process
    redirectToEvent();
  </script>
</body>
</html>
