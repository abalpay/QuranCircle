name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Run database unit tests
        run: supabase test db --local

      - name: Export app env from local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3101"
            echo "NEXT_PUBLIC_ENABLE_ANONYMOUS_AUTH=true"
            echo "NEXT_PUBLIC_ENABLE_INSTALL_PROMPT=true"
            echo "PLAYWRIGHT_PORT=3101"
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:3101"
            echo "AUTH_MERGE_COOKIE_SECRET=ci-merge-cookie-secret"
            echo "E2E_SMOKE_SHORT_CODE=E2ESMOKE1"
            echo "E2E_LOCKED_SHORT_CODE=E2ELOCK1"
            echo "E2E_ARCHIVED_SHORT_CODE=E2EARCH1"
          } >> "$GITHUB_ENV"

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Run DB contract checks
        run: npm run test:contracts

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop
