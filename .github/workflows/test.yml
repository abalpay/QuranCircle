name: Test

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Run database unit tests
        run: supabase test db --local

      - name: Export app env from local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3101"
            echo "NEXT_PUBLIC_ENABLE_ANONYMOUS_AUTH=true"
            echo "NEXT_PUBLIC_ENABLE_INSTALL_PROMPT=true"
            echo "PLAYWRIGHT_PORT=3101"
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:3101"
            echo "AUTH_MERGE_COOKIE_SECRET=ci-merge-cookie-secret"
            echo "E2E_SMOKE_SHORT_CODE=E2ESMOKE1"
            echo "E2E_LOCKED_SHORT_CODE=E2ELOCK1"
            echo "E2E_ARCHIVED_SHORT_CODE=E2EARCH1"
          } >> "$GITHUB_ENV"

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Run security regressions
        run: |
          npm run test:security:email
          npm run test:security:db

      - name: Run DB contract checks
        run: npm run test:contracts

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop
