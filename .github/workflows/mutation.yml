name: Mutation Test

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database with deterministic seed
        run: supabase db reset --local --yes

      - name: Export app env from local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3101"
            echo "NEXT_PUBLIC_ENABLE_ANONYMOUS_AUTH=true"
            echo "AUTH_MERGE_COOKIE_SECRET=ci-merge-cookie-secret"
          } >> "$GITHUB_ENV"

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop
