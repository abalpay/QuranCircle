name: Mutation Test

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database with deterministic seed
        run: supabase db reset --local --yes

      - name: Export app env from local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3101"
            echo "NEXT_PUBLIC_ENABLE_ANONYMOUS_AUTH=true"
            echo "AUTH_MERGE_COOKIE_SECRET=ci-merge-cookie-secret"
          } >> "$GITHUB_ENV"

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop
